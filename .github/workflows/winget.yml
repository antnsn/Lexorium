name: Publish to Winget

on:
  release:
    types: [published]

  # Allow manual triggering
  workflow_dispatch:
    inputs:
      version:
        description: "Specify the version number (optional, e.g. v3.0.2 )"
        required: false
        default: ""
      asset_name:
        description: "Specify the asset name (optional, e.g., LexoriumSetup.exe)"
        required: false
        default: ""

env:
  REGEX: 'LexoriumSetup\.exe'

jobs:
  publish:
    runs-on: windows-latest
    steps:
      - name: Publish Lexorium to Winget
        run: |
          # Convert the release assets to JSON for processing
          $assets = '${{ toJSON(github.event.release.assets) }}' | ConvertFrom-Json
          Write-Host "Available assets:"
          $assets | ForEach-Object { Write-Host $_.name }
          
          # Find the setup exe asset
          $wingetRelevantAsset = $assets | Where-Object { $_.name -match $env:REGEX } | Select-Object -First 1
          
          if (-not $wingetRelevantAsset) {
            throw "No matching asset found for regex $env:REGEX. Please ensure LexoriumSetup.exe is included in the release."
          }
          
          # Extract the version number from the release tag (remove 'v' prefix if present)
          $version = '${{ github.event.release.tag_name }}'.TrimStart('v')

          # Winget package name (must match the ID registered with Winget)
          $wingetPackage = "antnsn.lexorium"

          # Log details for debugging
          Write-Host "Detected Winget package: $wingetPackage"
          Write-Host "Detected version: $version"
          Write-Host "Asset URL: $($wingetRelevantAsset.browser_download_url)"
          
          # Download WingetCreate tool
          & curl.exe -JLO https://aka.ms/wingetcreate/latest
          
          # Update the package in Winget
          & .\wingetcreate.exe update $wingetPackage `
            -s `
            -v $version `
            -u $wingetRelevantAsset.browser_download_url `
            -t "${{ secrets.WINGET_TOKEN }}"