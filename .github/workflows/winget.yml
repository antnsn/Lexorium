name: Update WinGet

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (e.g., v3.0.2)'
        required: true


jobs:
  update:
    name: Update Package
    runs-on: ubuntu-latest
    steps:
    - name: Update Packages
      uses: michidk/winget-updater@v1
      with:
        komac-token: ${{ secrets.WINGET_TOKEN }}
        identifier: "antnsn.lexorium"
        repo: "antnsn/Lexoriumi"
        URL: "https://github.com/antnsn/Lexorium/releases/download/{VERSION}/LexoriumSetup.exe"