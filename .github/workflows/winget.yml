name: Update WinGet

on:
  release:
    types: [published]

  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (e.g. v4.0.0)'
        required: true

jobs:
  update:
    name: Update Package
    runs-on: ubuntu-latest
    steps:
      - name: Determine version
        run: |
          VERSION="${{ github.event.release.tag_name || github.event.inputs.version }}"
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "RAW_VERSION=${VERSION#v}" >> $GITHUB_ENV

      - name: Update Packages
        uses: michidk/winget-updater@v1
        with:
          komac-token: ${{ secrets.WINGET_TOKEN }}
          identifier: 'antnsn.lexorium'
          repo: 'antnsn/Lexorium'
          url: 'https://github.com/antnsn/Lexorium/releases/download/${{ env.VERSION }}/Lexorium_${{ env.RAW_VERSION }}_x64-setup.exe'
