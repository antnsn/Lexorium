name: Mac App Store

# Manual only. Builds the Tauri app, signs it for the Mac App Store,
# wraps it in a signed installer .pkg, and uploads to App Store Connect.
#
# IMPORTANT — this is NOT the iOS "cloud signing" pipeline.
# Cloud signing (xcodebuild -allowProvisioningUpdates + ASC API key minting
# certs/profiles on the fly) is an xcodebuild-only feature. Tauri signs with
# local `codesign`, so the certs + provisioning profile must be supplied as
# secrets and imported into a temporary keychain. The ASC API key here is used
# ONLY for the upload step (altool --apiKey), not for signing.

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  APP_NAME: Lexorium
  BUNDLE_ID: com.antnsn.lexorium

jobs:
  mac-app-store:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Use the newest stable Xcode on the runner (provides codesign,
      # productbuild, altool). A hard pin breaks when the image rotates.
      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: app/package-lock.json

      - name: Install Rust (universal targets)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri -> target

      - name: Install frontend dependencies
        run: npm ci
        working-directory: app

      # --- Signing material ----------------------------------------------------
      # Decode with `openssl base64 -d -A` (BSD base64 on the runner has no
      # GNU --decode; -A reads the whole single-line secret).
      - name: Import certificates and provisioning profile
        env:
          DIST_CERT_P12: ${{ secrets.APPLE_DIST_CERT_P12 }}
          INSTALLER_CERT_P12: ${{ secrets.APPLE_INSTALLER_CERT_P12 }}
          CERT_PASSWORD: ${{ secrets.APPLE_CERT_PASSWORD }}
          PROFILE_B64: ${{ secrets.MAS_PROVISION_PROFILE_BASE64 }}
        run: |
          set -euo pipefail
          KEYCHAIN="$RUNNER_TEMP/mas.keychain-db"
          KEYCHAIN_PWD="$(uuidgen)"

          security create-keychain -p "$KEYCHAIN_PWD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PWD" "$KEYCHAIN"

          echo "$DIST_CERT_P12"      | openssl base64 -d -A -out "$RUNNER_TEMP/dist.p12"
          echo "$INSTALLER_CERT_P12" | openssl base64 -d -A -out "$RUNNER_TEMP/installer.p12"

          security import "$RUNNER_TEMP/dist.p12"      -k "$KEYCHAIN" -P "$CERT_PASSWORD" -T /usr/bin/codesign -T /usr/bin/productbuild
          security import "$RUNNER_TEMP/installer.p12" -k "$KEYCHAIN" -P "$CERT_PASSWORD" -T /usr/bin/codesign -T /usr/bin/productbuild

          # Allow command-line tools to use the keys without an interactive prompt.
          security set-key-partition-list -S apple-tool:,apple:,codesign:,productbuild: -k "$KEYCHAIN_PWD" "$KEYCHAIN" >/dev/null

          # Put our keychain first in the search list so the tools find the identities.
          security list-keychains -d user -s "$KEYCHAIN" login.keychain-db

          # Install the provisioning profile where altool/codesign expect it.
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          echo "$PROFILE_B64" | openssl base64 -d -A -out "$RUNNER_TEMP/app.provisionprofile"

          echo "KEYCHAIN=$KEYCHAIN" >> "$GITHUB_ENV"

      # Add the App ID + Team ID entitlements at sign time so the Team ID is not
      # committed. Both are mandatory in the final signature for MAS acceptance.
      - name: Compose MAS entitlements
        env:
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          ENT="$RUNNER_TEMP/mas-entitlements.plist"
          cp app/src-tauri/entitlements.plist "$ENT"
          /usr/libexec/PlistBuddy -c "Add :com.apple.application-identifier string ${TEAM_ID}.${BUNDLE_ID}" "$ENT"
          /usr/libexec/PlistBuddy -c "Add :com.apple.developer.team-identifier string ${TEAM_ID}" "$ENT"
          echo "MAS_ENTITLEMENTS=$ENT" >> "$GITHUB_ENV"

      # Build the universal .app only (no dmg). Tauri's own signing is skipped
      # (no APPLE_SIGNING_IDENTITY) because we re-sign manually below with the
      # provisioning profile embedded and the full MAS entitlements.
      - name: Build Tauri app (universal)
        working-directory: app
        run: npx tauri build --target universal-apple-darwin --bundles app

      - name: Sign, package, and upload
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_API_KEY_P8: ${{ secrets.ASC_API_KEY_P8 }}
          BUILD_NUMBER: ${{ github.run_number }}
        run: |
          set -euo pipefail
          APP="app/src-tauri/target/universal-apple-darwin/release/bundle/macos/${APP_NAME}.app"
          test -d "$APP" || { echo "::error::App bundle not found at $APP"; exit 1; }

          # Build number — marketing version (CFBundleShortVersionString) stays
          # whatever tauri.conf.json declares; CFBundleVersion must increase per upload.
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion ${BUILD_NUMBER}" "$APP/Contents/Info.plist"

          # Embed the provisioning profile.
          cp "$RUNNER_TEMP/app.provisionprofile" "$APP/Contents/embedded.provisionprofile"

          # Resolve identities from the imported certs.
          SIGN_ID=$(security find-identity -v -p codesigning "$KEYCHAIN" | awk -F'"' '/Apple Distribution/{print $2; exit}')
          INSTALLER_ID=$(security find-identity -v "$KEYCHAIN" | awk -F'"' '/(3rd Party Mac Developer Installer|Mac Installer Distribution)/{print $2; exit}')
          test -n "$SIGN_ID"      || { echo "::error::No 'Apple Distribution' identity found"; exit 1; }
          test -n "$INSTALLER_ID" || { echo "::error::No installer identity found"; exit 1; }
          echo "App identity:       $SIGN_ID"
          echo "Installer identity: $INSTALLER_ID"

          # Sign nested code first (frameworks/helpers if any), then the app with
          # hardened runtime + entitlements. --options runtime enables Hardened Runtime.
          if [ -d "$APP/Contents/Frameworks" ]; then
            find "$APP/Contents/Frameworks" -type f \( -name '*.dylib' -o -perm -111 \) \
              -exec codesign --force --timestamp --options runtime --keychain "$KEYCHAIN" --sign "$SIGN_ID" {} \;
          fi
          codesign --force --timestamp --options runtime \
            --entitlements "$MAS_ENTITLEMENTS" \
            --keychain "$KEYCHAIN" --sign "$SIGN_ID" "$APP"
          codesign --verify --deep --strict --verbose=2 "$APP"

          # Mac App Store requires an installer .pkg signed with the installer identity.
          PKG="$RUNNER_TEMP/${APP_NAME}.pkg"
          productbuild --component "$APP" /Applications \
            --sign "$INSTALLER_ID" --keychain "$KEYCHAIN" "$PKG"

          # ASC API key (.p8) for upload. altool searches ~/.appstoreconnect/private_keys.
          mkdir -p "$HOME/.appstoreconnect/private_keys"
          echo "$ASC_API_KEY_P8" | openssl base64 -d -A -out "$HOME/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8"

          # Validate then upload. App Store uploads do NOT require notarization.
          xcrun altool --validate-app --type macos --file "$PKG" \
            --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID"
          xcrun altool --upload-app --type macos --file "$PKG" \
            --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID"

      - name: Clean up keychain
        if: always()
        run: security delete-keychain "$KEYCHAIN" 2>/dev/null || true
