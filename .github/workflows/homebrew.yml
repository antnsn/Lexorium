name: Update Homebrew Formula

on:
  release:
    types: [published]

  workflow_dispatch:
    inputs:
      version:
        description: "Specify the version number (optional)"
        required: false
        default: ""

jobs:
  update-formula:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Homebrew Repository
        uses: actions/checkout@v3

      - name: Set Variables
        id: vars
        run: |
          echo "RELEASE_VERSION=${{ github.event.release.tag_name }}" >> $GITHUB_ENV
          echo "ASSET_URL=$(echo '${{ toJSON(github.event.release.assets) }}' | jq -r '.[] | select(.name == "LexoriumSetup.exe").browser_download_url')" >> $GITHUB_ENV

      - name: Download Release Asset
        run: |
          curl -L $ASSET_URL -o LexoriumSetup.exe

      - name: Calculate SHA-256 Checksum
        id: checksum
        run: |
          sha256sum LexoriumSetup.exe | awk '{ print $1 }' > sha256.txt
          echo "SHA256=$(cat sha256.txt)" >> $GITHUB_ENV

      - name: Update Formula
        run: |
          FORMULA_FILE="Formula/lexorium.rb"
          
          # Update the version field
          sed -i "s/version \".*\"/version \"$RELEASE_VERSION\"/" $FORMULA_FILE
          
          # Update the sha256 field
          sed -i "s/sha256 \".*\"/sha256 \"$SHA256\"/" $FORMULA_FILE

      - name: Commit and Push Changes
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --global user.name "antnsn"
          git config --global user.email "antonsen.marius@gmail.com"
          git add Formula/lexorium.rb
          git commit -m "Update Homebrew formula to version $RELEASE_VERSION"
          git push
