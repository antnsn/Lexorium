name: Update Homebrew Formula

on:
  release:
    types: [published]

  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (e.g. v4.0.0)'
        required: false
        default: ''

jobs:
  update-formula:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Homebrew Repository
        uses: actions/checkout@v4
        with:
          repository: antnsn/homebrew-lexorium
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}

      - name: Determine Version
        id: vars
        run: |
          if [ -n "${{ github.event.release.tag_name }}" ]; then
            VERSION=${{ github.event.release.tag_name }}
          elif [ -n "${{ github.event.inputs.version }}" ]; then
            VERSION=${{ github.event.inputs.version }}
          else
            echo "Error: No release tag or input version provided." >&2
            exit 1
          fi
          echo "RELEASE_VERSION=$VERSION" >> $GITHUB_ENV

          # Tauri produces .dmg for macOS
          ASSET_URL="https://github.com/antnsn/Lexorium/releases/download/$VERSION/Lexorium_${VERSION#v}_aarch64.dmg"
          echo "ASSET_URL=$ASSET_URL" >> $GITHUB_ENV

      - name: Download Release Asset
        run: |
          echo "Downloading from: $ASSET_URL"
          curl -fSL "$ASSET_URL" -o "release.dmg"
          ls -lh "release.dmg"

      - name: Calculate SHA-256 Checksum
        run: |
          SHA256=$(sha256sum "release.dmg" | awk '{ print $1 }')
          echo "SHA256=$SHA256" >> $GITHUB_ENV
          echo "Checksum: $SHA256"

      - name: Update Formula
        run: |
          FORMULA_FILE="Casks/lexorium.rb"

          sed -i "s|url \".*\"|url \"https://github.com/antnsn/Lexorium/releases/download/v#{version}/Lexorium_#{version}_aarch64.dmg\"|" $FORMULA_FILE
          sed -i "s/version \".*\"/version \"${RELEASE_VERSION#v}\"/" $FORMULA_FILE
          sed -i "s/sha256 \".*\"/sha256 \"$SHA256\"/" $FORMULA_FILE

      - name: Commit and Push Changes
        env:
          GITHUB_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          git config --global user.name "antnsn"
          git config --global user.email "antonsen.marius@gmail.com"
          git add Casks/lexorium.rb
          git commit -m "Update Homebrew formula to version $RELEASE_VERSION"
          git push
