<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Lexorium</title>
        <link rel="stylesheet" href="styles.css" />
        <link
            rel="stylesheet"
            href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css"
        />
        <link
            id="highlight-style"
            rel="stylesheet"
            href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.10.0/styles/atom-one-dark.min.css"
        />
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@300..700&family=Lora:ital,wght@0,400..700;1,400..700&display=swap" rel="stylesheet">
    </head>
    <body>
        <div id="container">
            <!-- TOC Section -->
            <div id="toc-section">
                <div class="toc-header">
                    <h1 id="logo">Lexorium</h1>
                </div>
                <h2>Notes</h2>
                <div id="toc"></div>
                <div id="undo-container">
                  <button type="button" class="undo-button" id="undo">Undo Delete</button>
                </div>
            </div>

            <!-- Divider between TOC and Document sections -->
            <div class="divider"></div>

            <!-- Document Section -->
            <div id="doc-section">
                <div id="doc-toolbar">
                    <div id="doc-search-wrapper">
                        <i class="fas fa-search" id="doc-search-icon"></i>
                        <input type="text" id="doc-search-input" placeholder="Search notes…" />
                    </div>
                    <div id="doc-toolbar-actions">
                        <button id="toggle-compose" title="New note (⌘⇧N)">
                            <i class="fas fa-edit"></i>
                        </button>
                        <button id="settings-button" title="Settings">
                            <i class="fas fa-cog"></i>
                        </button>
                    </div>
                </div>

                <div id="compose-panel" class="collapsed">
                    <input type="text" id="header-input" placeholder="Title" />
                    <textarea id="body-input" placeholder="Write something…"></textarea>
                    <div class="compose-controls">
                        <label class="checkbox-label">
                            <input type="checkbox" id="use-chatgpt" />
                            ✨ Enhance with AI
                        </label>
                        <div class="compose-actions">
                            <button id="cancel-compose" class="compose-btn-secondary">Cancel</button>
                            <button id="add-note" class="compose-btn-primary">
                                <span class="button-content">
                                    <span class="button-text">Add Note</span>
                                </span>
                            </button>
                        </div>
                    </div>
                </div>

                <div id="document-view"></div>
            </div>
        </div>

        <!-- Settings Modal -->
        <div id="settings-modal" class="modal">
            <div class="modal-content">
                <div class="modal-header">
                    <h2>Settings</h2>
                    <button class="close-modal">&times;</button>
                </div>
                <div class="settings-section">
                    <label for="ai-provider">AI Provider:</label>
                    <select id="ai-provider">
                        <option value="openai">OpenAI</option>
                        <option value="anthropic">Anthropic</option>
                        <option value="openrouter">OpenRouter</option>
                    </select>

                    <label for="ai-model" id="ai-model-label">Model:</label>
                    <input type="text" id="ai-model" placeholder="gpt-4o">

                    <label for="api-key" id="api-key-label">API Key:</label>
                    <input type="password" id="api-key" placeholder="Enter your API key">

                    <button id="save-api-key">Save Settings</button>
                </div>
            </div>
        </div>

        <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.10.0/highlight.min.js"></script>
        <script src="https://cdnjs.cloudflare.com/ajax/libs/marked/4.0.2/marked.min.js"></script>
        <script>
            console.log("marked.js is loaded:", typeof marked !== "undefined");
            console.log("highlight.js is loaded:", typeof hljs !== "undefined");
        </script>
        <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
        <script src="https://cdnjs.cloudflare.com/ajax/libs/autosize.js/6.0.1/autosize.min.js"></script>
        <script src="renderer.js"></script>
        <script>
            // Handle all link clicks to open in external browser
            document.addEventListener('click', async (event) => {
                const link = event.target.closest('a');
                if (link && link.classList.contains('external-link')) {
                    event.preventDefault();
                    const href = link.getAttribute('href');
                    if (href && href.startsWith('http')) {
                        try {
                            await window.electronAPI.openExternalLink(href);
                        } catch (error) {
                            console.error('Failed to open external link:', error);
                        }
                    }
                }
                // Let internal links (like #section-1) work normally
            });
        </script>
    </body>
</html>
