<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Lexorium</title>
        <link rel="stylesheet" href="styles.css" />
        <link
            rel="stylesheet"
            href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css"
        />
        <link
            id="highlight-style"
            rel="stylesheet"
            href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.10.0/styles/atom-one-dark.min.css"
        />
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@300..700&display=swap" rel="stylesheet">
    </head>
    <body>
        <div id="container">
            <!-- TOC Section -->
            <div id="toc-section">
                <div class="toc-header">
                    <h1 id="logo">Lexorium</h1>
                </div>
                <h2>Table of Contents</h2>
                <input type="text" id="search-input" placeholder="Search..." />
                <div id="toc"></div>
                <div id="undo-container">
                  <button type="button" class="undo-button" id="undo">Undo Delete</button>
                </div>
            </div>

            <!-- Divider between TOC and Document sections -->
            <div class="divider"></div>

            <!-- Document Section -->
            <div id="doc-section">
                <div id="document-view"></div>
            </div>

            <!-- Divider between Document and New Note sections -->
            <div class="divider"></div>

            <!-- New Note Section -->
            <div id="input-section">
                <h2>New Note</h2>
                <input
                    type="text"
                    id="header-input"
                    placeholder="Header (optional)"
                />
                <textarea id="body-input" placeholder="Body"></textarea>
                <div class="input-controls">
                    <label class="checkbox-label">
                        <input type="checkbox" id="use-chatgpt" />
                        Analyze with ChatGPT
                    </label>
                    <button id="add-note">
                        <span class="button-content">
                            <span class="button-text">Add Note</span>
                        </span>
                    </button>
                </div>
            </div>
        </div>

        <!-- Settings Modal -->
        <div id="settings-modal" class="modal">
            <div class="modal-content">
                <div class="modal-header">
                    <h2>Settings</h2>
                    <button class="close-modal">&times;</button>
                </div>
                <div class="settings-section">
                    <label for="api-key">OpenAI API Key:</label>
                    <input type="password" id="api-key" placeholder="Enter your OpenAI API key">
                    <button id="save-api-key">Save API Key</button>
                </div>
            </div>
        </div>

        <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.10.0/highlight.min.js"></script>
        <script src="https://cdnjs.cloudflare.com/ajax/libs/marked/4.0.2/marked.min.js"></script>
        <script>
            console.log("marked.js is loaded:", typeof marked !== "undefined");
            console.log("highlight.js is loaded:", typeof hljs !== "undefined");
        </script>
        <script src="renderer.js"></script>
        <script>
            // Handle all link clicks to open in external browser
            document.addEventListener('click', async (event) => {
                const link = event.target.closest('a');
                if (link && link.classList.contains('external-link')) {
                    event.preventDefault();
                    const href = link.getAttribute('href');
                    if (href && href.startsWith('http')) {
                        try {
                            await window.electronAPI.openExternalLink(href);
                        } catch (error) {
                            console.error('Failed to open external link:', error);
                        }
                    }
                }
                // Let internal links (like #section-1) work normally
            });

            function editSection(sectionId) {
                const section = document.getElementById(`section-${sectionId}`);
                const markdownBody = section.querySelector('.markdown-body');
                
                // Get the section data from the current document
                const sectionData = currentDocumentData.sections.find(s => s.id === sectionId);
                if (!sectionData) return;

                // Create textarea with section content
                const textarea = document.createElement('textarea');
                textarea.value = sectionData.content;
                textarea.style.width = '100%';
                textarea.style.minHeight = '200px';
                textarea.style.marginBottom = '10px';

                // Create action buttons
                const actions = document.createElement('div');
                actions.className = 'edit-actions';
                actions.innerHTML = `
                    <button class="save-button" onclick="saveSection('${sectionId}')">Save</button>
                    <button class="cancel-button" onclick="cancelEdit('${sectionId}')">Cancel</button>
                `;

                // Replace content with editor
                markdownBody.innerHTML = '';
                markdownBody.appendChild(textarea);
                markdownBody.appendChild(actions);
                
                // Add editing class for styling
                section.classList.add('editing');
            }

            function saveSection(sectionId) {
                const section = document.getElementById(`section-${sectionId}`);
                const markdownBody = section.querySelector('.markdown-body');
                const textarea = markdownBody.querySelector('textarea');
                const newContent = textarea.value;

                // Update the section data
                const sectionIndex = currentDocumentData.sections.findIndex(s => s.id === sectionId);
                if (sectionIndex !== -1) {
                    currentDocumentData.sections[sectionIndex].content = newContent;
                }

                // Update the rendered content
                markdownBody.innerHTML = marked.parse(newContent);
                
                // Remove editing class
                section.classList.remove('editing');

                // Save the entire document
                saveDocument();
            }

            function cancelEdit(sectionId) {
                const section = document.getElementById(`section-${sectionId}`);
                const markdownBody = section.querySelector('.markdown-body');
                
                // Get the original content from document data
                const sectionData = currentDocumentData.sections.find(s => s.id === sectionId);
                if (!sectionData) return;

                // Restore the original content
                markdownBody.innerHTML = marked.parse(sectionData.content);
                
                // Remove editing class
                section.classList.remove('editing');
            }

            async function saveDocument() {
                // Save the JSON document
                try {
                    await window.electronAPI.saveFile({
                        filePath: currentFilePath,
                        content: JSON.stringify(currentDocumentData, null, 2)
                    });
                } catch (error) {
                    console.error('Failed to save document:', error);
                }
            }
        </script>
    </body>
</html>
